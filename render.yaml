services:
  - type: web
    name: panic-protocol-server
    runtime: node
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: ROUND_SECONDS
        value: "45"
